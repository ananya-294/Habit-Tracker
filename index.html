<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HabitFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>HabitFlow</h1>
    <p class="subtitle">Build your day, one habit at a time.</p>
    <p id="today-weekday" class="weekday"></p>
    <p id="today-date" class="date"></p>
  </header>

  <main>

    <!-- Today's progress -->
    <section class="rhythm-section">
      <h2>Today's Rhythm</h2>
      <p id="progress-count" class="progress-count">0 / 0 habits</p>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-percent" class="progress-percent">0%</p>
      <p id="progress-message" class="progress-message"></p>
    </section>

    <!-- List of habits -->
    <section class="habit-list-section">
      <div id="habits-container"></div>
      <p id="empty-message" class="empty-message">
        No habits yet.<br>
        Add your first habit and start your rhythm.
      </p>
    </section>

    <!-- Add a new habit -->
    <section class="add-habit-section">
      <h2>+ Add a New Habit</h2>
      <form id="habit-form">
        <div class="form-row">
          <label for="habit-name">Habit name</label>
          <input type="text" id="habit-name" placeholder="e.g. Read 20 pages">
        </div>

        <div class="form-row">
          <label for="habit-category">Category</label>
          <select id="habit-category">
            <option>Study</option>
            <option>Exercise</option>
            <option>Reading</option>
            <option>Health</option>
            <option>Personal</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="habit-goal">Daily goal (optional)</label>
          <input type="text" id="habit-goal" placeholder="e.g. 08:00 or 20 pages">
        </div>

        <div class="form-buttons">
          <button type="submit">Add Habit</button>
          <button type="button" id="clear-btn">Clear</button>
        </div>
      </form>
    </section>

  </main>

  <!-- Settings -->
  <footer class="settings-section">
    <div class="setting-row">
      <label for="theme-toggle">Dark Mode</label>
      <input type="checkbox" id="theme-toggle">
    </div>
    <div class="setting-row">
      <span>Reset All Data</span>
      <button id="reset-btn" class="reset-btn">Reset</button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
